<div class="navigation-wrapper">
  <nav aria-label="Main navigation" id="site-nav">
    <a href="{{ site.url }}" class="site-name">filipambroz</a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle menu">
      <span class="nav-toggle-icon"></span>
    </button>
    <ul id="nav-menu">
      {% for link in site.links %}
      <li>
        {% if link.external %}
          <a href="{{ link.url }}" rel="noopener noreferrer">{{ link.title }}</a>
        {% else %}
          <a href="{{ site.url }}{{ link.url }}">{{ link.title }}</a>
        {% endif %}
      </li>
      {% endfor %}
    </ul>
  </nav>
</div>
