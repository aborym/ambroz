<div class="navigation-wrapper">
  <nav aria-label="Hlavní navigace" id="site-nav">
    <a href="{{ site.url }}" class="site-logo" rel="home" title="{{ site.title }}">
      <img src="{{ site.url }}/images/{{ site.logo }}" width="40" height="40" alt="{{ site.title }}" loading="eager">
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Otevřít menu">
      <span class="nav-toggle-icon"></span>
    </button>
    <ul id="nav-menu">
      {% for link in site.links %}
      <li>
        {% if link.external %}
          <a href="{{ link.url }}" rel="noopener noreferrer">{{ link.title }}</a>
        {% else %}
          <a href="{{ site.url }}{{ link.url }}">{{ link.title }}</a>
        {% endif %}
      </li>
      {% endfor %}
    </ul>
  </nav>
</div>

{% unless page.url == "/" %}
{% if page.image.feature %}
<header class="masthead">
  <div class="wrap">
    <a href="{{ site.url }}" class="site-logo-large" rel="home" title="{{ site.title }}">
      <img src="{{ site.url }}/images/{{ site.logo }}" width="200" height="200" alt="{{ site.title }} logo">
    </a>
  </div>
</header>
{% else %}
<header class="masthead">
  <div class="wrap">
    <a href="{{ site.url }}" class="site-logo-large" rel="home" title="{{ site.title }}">
      <img src="{{ site.url }}/images/{{ site.logo }}" width="200" height="200" alt="{{ site.title }} logo">
    </a>
    <h1 class="site-title"><a href="{{ site.url }}">{{ site.title }}</a></h1>
    <p class="site-description">{{ site.description }}</p>
  </div>
</header>
{% endif %}
{% endunless %}
