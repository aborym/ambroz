---
layout: default
---

<article class="entry">
  {% if page.image.feature %}<img src="{{ site.url }}/images/{{ page.image.feature }}" class="entry-feature-image" alt="{{ page.title }}" loading="lazy" decoding="async">{% endif %}
  <div class="entry-wrapper">
    <header class="entry-header">
      <h1 class="entry-title">{% if page.headline %}{{ page.headline }}{% else %}{{ page.title }}{% endif %}</h1>
    </header>
    <div class="entry-content">
      {{ content }}
    </div>
  </div>
</article>
